[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blackbar"
version = "0.1.0"
description = "A dependency-free PII scrubber that validates what it finds."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["pii", "redaction", "privacy", "anonymisation", "gdpr", "logging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Text Processing :: Filters",
    "Typing :: Typed",
]

# No runtime dependencies. This is a feature, not an oversight: a tool you run
# over sensitive data should have the smallest possible supply chain.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mypy>=1.8",
    "ruff>=0.3",
]

[project.scripts]
blackbar = "blackbar.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/blackbar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["blackbar"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "\\.\\.\\."]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src/blackbar"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
